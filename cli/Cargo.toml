[package]
name = "toon2"
version = "0.4.0"
edition = "2024"
authors = ["Daniel Kovacs"]
description = "CLI tool for converting between JSON, YAML, and TOON formats"
homepage = "https://github.com/danielkov/toon-rust"
repository = "https://github.com/danielkov/toon-rust"
license = "MIT"
keywords = ["toon", "json", "yaml", "converter", "cli"]
categories = ["command-line-utilities", "encoding"]

[[bin]]
name = "toon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.51", features = ["derive"] }
reqwest = "0.12.24"
tokio = { version = "1.48.0", features = ["full"] }
serde_toon2 = { version = "0.2.0", path = "../serde_toon2" }
serde_json = "1.0.145"
serde_yaml = "0.9"
